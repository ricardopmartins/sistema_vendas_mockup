<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="container">
      <div class="mt-3 shadow-lg">
        <div class="card-body">
          <div class="card text-left">
            <img class="card-img-top w-25" src="../public/images/um-prato-de-frango-assado-e-um-banquete-delicioso.avif" alt="Prato de Frango Delecioso">
            <div class="card-body">
              <h4 class="card-title">Cadastro de Produto</h4>
              <p class="card-text">Body</p>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="row g-0">
          <div class="col-md-4">
            <img src="public/images/um-prato-de-frango-assado-e-um-banquete-delicioso.avif" class="img-fluid rounded-start w-50" alt="Filé de Frango">
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h4 class="card-title">Filé de Frango</h4>
              <p class="card-text">Proteina e Alguma coisa</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script> -->
    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      fetch('Layout.html')
      .then(response => response.text())
      .then(data => {
      document.getElementById('navbar-placeholder').innerHTML = data;
      });
    </script>
  </body>
</html>
